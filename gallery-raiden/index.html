  <script>
    let currentImageIndex = 0;
    let visibleImages = [];
    
    function openLightbox(imgSrc, index) {
      currentImageIndex = index;
      document.getElementById('lightboxImage').src = imgSrc;
      document.getElementById('imageLightbox').style.display = 'flex';
      document.body.style.overflow = 'hidden';
      updateCounter();
    }
    
    function closeLightbox() {
      document.getElementById('imageLightbox').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
    
    function showPrev() {
      currentImageIndex = (currentImageIndex - 1 + visibleImages.length) % visibleImages.length;
      document.getElementById('lightboxImage').src = visibleImages[currentImageIndex];
      updateCounter();
    }
    
    function showNext() {
      currentImageIndex = (currentImageIndex + 1) % visibleImages.length;
      document.getElementById('lightboxImage').src = visibleImages[currentImageIndex];
      updateCounter();
    }
    
    function updateCounter() {
      document.getElementById('lightboxCounter').textContent = (currentImageIndex + 1) + ' / ' + visibleImages.length;
    }
    
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', function(e) { e.stopPropagation(); showPrev(); });
    document.getElementById('lightboxNext').addEventListener('click', function(e) { e.stopPropagation(); showNext(); });
    document.getElementById('imageLightbox').addEventListener('click', function(e) {
      if (e.target.id === 'imageLightbox') closeLightbox();
    });
    
    document.addEventListener('keydown', function(e) {
      if (document.getElementById('imageLightbox').style.display === 'flex') {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'ArrowRight') showNext();
      }
    });
  </script>

    // Fungsi untuk menentukan kategori berdasarkan nama file
    function getCategory(filename) {
      const lower = filename.toLowerCase();
      
      // Genshin Impact keywords
      const genshinKeywords = ['genshin', 'raiden', 'shogun', 'xiao', 'arlecchino', 'navia', 'yae', 'miko', 
        'zhongli', 'hutao', 'ganyu', 'ayaka', 'kazuha', 'nahida', 'furina', 'neuvillette', 'wanderer',
        'yelan', 'shenhe', 'kokomi', 'eula', 'keqing', 'diluc', 'klee', 'venti', 'albedo', 'tartaglia',
        'childe', 'ningguang', 'beidou', 'fischl', 'mona', 'qiqi', 'jean', 'barbara', 'amber', 'lisa',
        'kaeya', 'razor', 'bennett', 'xingqiu', 'xiangling', 'sucrose', 'chongyun', 'noelle', 'diona',
        'xinyan', 'rosaria', 'yanfei', 'sayu', 'thoma', 'gorou', 'yunjin', 'shinobu', 'heizou', 'tighnari',
        'collei', 'dori', 'candace', 'cyno', 'nilou', 'layla', 'faruzan', 'alhaitham', 'dehya', 'mika',
        'baizhu', 'kaveh', 'kirara', 'lynette', 'lyney', 'freminet', 'wriothesley', 'charlotte', 'navia',
        'chevreuse', 'gaming', 'xianyun', 'chiori', 'arlecchino', 'sethos', 'clorinde', 'sigewinne',
        'emilie', 'kachina', 'kinich', 'mualani', 'xilonen', 'ororon', 'chasca', 'mavuika'];
      
      // Honkai Star Rail keywords
      const hsrKeywords = ['honkai', 'star rail', 'starrail', 'hsr', 'kafka', 'seele', 'bronya', 'himeko',
        'welt', 'clara', 'jing yuan', 'luocha', 'silver wolf', 'blade', 'dan heng', 'march 7th', 'stelle',
        'caelus', 'trailblazer', 'gepard', 'pela', 'serval', 'natasha', 'sampo', 'hook', 'arlan', 'asta',
        'herta', 'qingque', 'tingyun', 'sushang', 'yukong', 'bailu', 'yanqing', 'fu xuan', 'lynx', 'luka',
        'guinaifen', 'topaz', 'huohuo', 'argenti', 'hanya', 'ruan mei', 'xueyi', 'dr ratio', 'black swan',
        'sparkle', 'misha', 'acheron', 'aventurine', 'gallagher', 'robin', 'boothill', 'firefly', 'jade',
        'jiaoqiu', 'yunli', 'march 7', 'feixiao', 'lingsha', 'moze', 'rappa', 'sunday', 'fugue', 'the herta',
        'aglaea', 'tribbie', 'mydei', 'castorice', 'anaxa', 'hyacine'];
      
      // Anime keywords
      const animeKeywords = ['anime', 'manga', 'waifu', 'slime', 'isekai', 'naruto', 'one piece', 'demon slayer',
        'attack on titan', 'jujutsu', 'spy x family', 'chainsaw', 'bocchi', 'oshi no ko', 'frieren',
        'download', 'sample_', 'anime_girl'];
      
      // Check Genshin
      for (const kw of genshinKeywords) {
        if (lower.includes(kw)) return 'genshin';
      }
      
      // Check HSR
      for (const kw of hsrKeywords) {
        if (lower.includes(kw)) return 'hsr';
      }
      
      // Check Anime
      for (const kw of animeKeywords) {
        if (lower.includes(kw)) return 'anime';
      }
      
      // Pixiv-style numbered files (likely Genshin fanart based on the collection)
      if (/^\d{8,}_p\d+\.(jpg|png|jpeg)$/i.test(filename)) {
        return 'genshin';
      }
      
      // Screenshots and WhatsApp images
      if (lower.includes('img_') || lower.includes('img-') || lower.includes('whatsapp')) {
        return 'other';
      }
      
      return 'other';
    }

    const galleryGrid = document.getElementById('galleryGrid');
    let allItems = [];
    
    // Generate gallery items
    allImages.forEach((filename, index) => {
      const cat = getCategory(filename);
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.dataset.category = cat;
      const imgSrc = '../assets/galery/' + encodeURIComponent(filename);
      
      const imgElement = document.createElement('img');
      imgElement.src = imgSrc;
      imgElement.loading = 'lazy';
      imgElement.alt = 'Gallery Image';
      imgElement.onclick = function() { 
        updateVisibleImages();
        const visibleIndex = visibleImages.indexOf(imgSrc);
        openLightbox(imgSrc, visibleIndex >= 0 ? visibleIndex : 0); 
      };
      
      imgElement.onload = function() { item.classList.add('loaded'); };
      
      const overlay = document.createElement('div');
      overlay.className = 'gallery-overlay';
      
      item.appendChild(imgElement);
      item.appendChild(overlay);
      galleryGrid.appendChild(item);
      allItems.push({element: item, src: imgSrc, cat: cat});
    });
    
    function updateVisibleImages() {
      visibleImages = allItems.filter(item => !item.element.classList.contains('hidden')).map(item => item.src);
    }
    
    // Filter functionality
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const filter = this.dataset.filter;
        allItems.forEach(item => {
          if (filter === 'all' || item.cat === filter) {
            item.element.classList.remove('hidden');
          } else {
            item.element.classList.add('hidden');
          }
        });
        updateVisibleImages();
      });
    });
    
    updateVisibleImages();

    // Hero Slideshow - hanya gambar landscape
    const landscapeImages = [];
    const heroSlideshow = document.getElementById('heroSlideshow');
    const heroSlideshowNext = document.getElementById('heroSlideshowNext');
    let currentSlide = 0;
    let slideshowReady = false;
    
    allImages.forEach(filename => {
      const img = new Image();
      img.src = '../assets/galery/' + encodeURIComponent(filename);
      img.onload = function() {
        if (this.width > this.height) {
          landscapeImages.push(img.src);
          if (!slideshowReady && landscapeImages.length >= 2) {
            slideshowReady = true;
            startSlideshow();
          }
        }
      };
    });
    
    function startSlideshow() {
      if (landscapeImages.length === 0) return;
      
      for (let i = landscapeImages.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [landscapeImages[i], landscapeImages[j]] = [landscapeImages[j], landscapeImages[i]];
      }
      
      heroSlideshow.style.backgroundImage = 'url("' + landscapeImages[0] + '")';
      
      setInterval(() => {
        currentSlide = (currentSlide + 1) % landscapeImages.length;
        heroSlideshowNext.style.backgroundImage = 'url("' + landscapeImages[currentSlide] + '")';
        
        heroSlideshow.classList.add('fade-out');
        heroSlideshowNext.classList.add('fade-in');
        
        setTimeout(() => {
          heroSlideshow.style.backgroundImage = 'url("' + landscapeImages[currentSlide] + '")';
          heroSlideshow.classList.remove('fade-out');
          heroSlideshowNext.classList.remove('fade-in');
        }, 1500);
      }, 5000);
    }
  </script>
